</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
 
const hero = document.querySelector('.hero');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
hero.prepend(renderer.domElement);
 
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.z = 9;
 
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(4, 6, 6);
scene.add(light);
 
const model = new THREE.Group();
scene.add(model);
 
new GLTFLoader().load('model.glb', (gltf) => {
  const obj = gltf.scene;
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = 2.2 / Math.max(size.x, size.y, size.z);   // fit to the old cube's size
  obj.scale.setScalar(s);
  obj.position.copy(center).multiplyScalar(-s);        // center it
  model.add(obj);
});
 
function resize() {
  renderer.setSize(hero.clientWidth, hero.clientHeight);
  camera.aspect = hero.clientWidth / hero.clientHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
 
// Mouse position, from -1 to 1 across the window
const mouse = { x: 0, y: 0 };
const smooth = { x: 0, y: 0 };
addEventListener('pointermove', (ev) => {
  mouse.x = (ev.clientX / innerWidth) * 2 - 1;
  mouse.y = (ev.clientY / innerHeight) * 2 - 1;
});
 
const start = new THREE.Vector3(-9, 4, -35);
const end = new THREE.Vector3(0, 1.2, 0);
const t0 = performance.now();
 
renderer.setAnimationLoop((now) => {
  const p = Math.min((now - t0) / 3000, 1);   // 3 second intro
  const e = 1 - Math.pow(1 - p, 3);           // ease out
 
  // ease toward the mouse so the movement is smooth
  smooth.x += (mouse.x - smooth.x) * 0.05;
  smooth.y += (mouse.y - smooth.y) * 0.05;
 
  model.position.lerpVectors(start, end, e);
  model.rotation.set(
    0.45 + 6.3 * (1 - e) + smooth.y * 0.6,
    0.78 + 18.8 * (1 - e) + smooth.x * 1.0,
    0 + 6.3 * (1 - e)
  );
  model.scale.setScalar(0.25 + 0.75 * e);
  renderer.render(scene, camera);
});
</script>
